<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Acc FF Clone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:#0a0e17; color:#e8eaed; min-height:100vh; line-height:1.5; }
  
  header {
    background:linear-gradient(135deg,#00c853 0%,#00a844 100%);
    padding:14px 20px; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:100;
    box-shadow:0 4px 20px rgba(0,200,83,.35);
  }
  .logo { font-size:19px; font-weight:800; cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; color:#fff; letter-spacing:.5px; }
  .logo span { color:#ffd700; }
  .logo img { max-height:42px; max-width:170px; object-fit:contain; }
  .user-area { display:flex; gap:10px; align-items:center; }
  .user-icon { 
    width:42px; height:42px; border-radius:50%; background:#fff; color:#00a844;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; cursor:pointer;
    border:2.5px solid #ffd700; box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:.2s;
  }
  .user-icon:hover { transform:scale(1.08); }
  
  main { padding:20px; max-width:1200px; margin:0 auto; }
  
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; margin-top:10px; }
  .card {
    background:#131826; border-radius:16px; overflow:hidden;
    border:1px solid #1f2937; transition:.3s ease; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
  .card:hover { transform:translateY(-6px); border-color:#00c853; box-shadow:0 12px 28px rgba(0,200,83,.3); }
  .card img { width:100%; height:170px; object-fit:cover; background:#1f2937; }
  .card-icon { width:100%; height:170px; display:flex; align-items:center; justify-content:center; font-size:75px; background:linear-gradient(135deg,#1f2937,#131826); }
  .card-body { padding:14px; }
  .card-body h3 { font-size:16px; margin-bottom:8px; font-weight:700; color:#fff; }
  .card-body .price { color:#ffd700; font-size:19px; font-weight:800; }
  .card-body .stock { font-size:12px; color:#6b7280; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .card-body .stock.out { color:#ef4444; font-weight:600; }
  .card.out-stock { opacity:.65; }
  .card.out-stock:hover { border-color:#ef4444; transform:none; }
  
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; justify-content:center; align-items:center; z-index:999; padding:15px; backdrop-filter:blur(4px); }
  .modal-bg.show { display:flex; animation:fadeIn .2s; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal { 
    background:#131826; border-radius:18px; padding:26px; max-width:460px; width:100%;
    max-height:90vh; overflow-y:auto; border:1px solid #1f2937;
    box-shadow:0 20px 60px rgba(0,0,0,.6); animation:slideUp .3s;
  }
  @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal h2 { margin-bottom:18px; color:#00c853; font-size:22px; font-weight:800; }
  .modal input, .modal textarea, .modal select {
    width:100%; padding:13px 15px; background:#0a0e17;
    border:1.5px solid #1f2937; border-radius:10px;
    color:#fff; margin-bottom:12px; font-size:14px;
    transition:.2s;
  }
  .modal input:focus, .modal textarea:focus { outline:none; border-color:#00c853; box-shadow:0 0 0 3px rgba(0,200,83,.15); }
  .modal textarea { min-height:85px; resize:vertical; font-family:inherit; }
  .modal .btn {
    width:100%; padding:13px; background:linear-gradient(135deg,#00c853,#00a844);
    color:#fff; border:none; border-radius:10px;
    font-weight:700; cursor:pointer; font-size:15px; margin-top:5px;
    transition:.2s; box-shadow:0 4px 12px rgba(0,200,83,.3);
  }
  .modal .btn:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,200,83,.45); }
  .modal .btn-secondary { background:#1f2937; box-shadow:none; }
  .modal .btn-secondary:hover { background:#374151; box-shadow:none; }
  .modal .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); box-shadow:0 4px 12px rgba(239,68,68,.3); }
  
  .link-small { text-align:center; margin-top:14px; font-size:13px; }
  .link-small a { color:#ffd700; cursor:pointer; text-decoration:none; font-weight:600; }
  .link-small a:hover { text-decoration:underline; }
  .admin-link { text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid #1f2937; }
  .admin-link a { color:#6b7280; font-size:12px; cursor:pointer; text-decoration:none; }
  .admin-link a:hover { color:#ffd700; }
  
  .panel-tabs-v { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .panel-tabs-v button {
    padding:13px 16px; background:#0a0e17; color:#e8eaed;
    border:1.5px solid #1f2937; border-radius:10px;
    cursor:pointer; font-size:14px; text-align:left; font-weight:600;
    transition:.2s;
  }
  .panel-tabs-v button:hover { background:#1f2937; }
  .panel-tabs-v button.active { background:linear-gradient(135deg,#00c853,#00a844); border-color:#00c853; color:#fff; box-shadow:0 4px 12px rgba(0,200,83,.3); }
  
  .item-box { background:#0a0e17; padding:14px; border-radius:12px; margin-bottom:10px; border-left:3px solid #00c853; }
  .item-box h4 { font-size:14px; margin-bottom:6px; color:#ffd700; font-weight:700; }
  .item-box p { font-size:13px; color:#9ca3af; }
  
  .balance { background:linear-gradient(135deg,#00c853,#00a844); padding:22px; border-radius:14px; text-align:center; margin-bottom:18px; box-shadow:0 8px 20px rgba(0,200,83,.25); }
  .balance .label { font-size:13px; color:rgba(255,255,255,.85); }
  .balance .num { font-size:34px; font-weight:800; color:#ffd700; margin-top:4px; text-shadow:0 2px 8px rgba(0,0,0,.3); }
  
  .admin-badge { background:linear-gradient(135deg,#ffd700,#ffb700); color:#000; padding:5px 11px; border-radius:14px; font-size:11px; font-weight:800; letter-spacing:.5px; }
  
  .deposit-box { background:#0a0e17; padding:16px; border-radius:12px; margin-bottom:14px; border:1.5px solid #1f2937; }
  .deposit-box .code { 
    background:#131826; padding:14px; border-radius:10px;
    font-family:'Courier New',monospace; font-size:16px; color:#ffd700;
    margin:10px 0; word-break:break-all; text-align:center;
    border:1.5px dashed #00c853; font-weight:700;
  }
  
  .notif { 
    position:fixed; top:80px; right:20px;
    background:linear-gradient(135deg,#00c853,#00a844); color:#fff;
    padding:14px 22px; border-radius:12px; font-weight:700; font-size:14px;
    z-index:9999; animation:slideIn .3s; box-shadow:0 8px 24px rgba(0,200,83,.4);
  }
  .notif.error { background:linear-gradient(135deg,#ef4444,#dc2626); box-shadow:0 8px 24px rgba(239,68,68,.4); }
  @keyframes slideIn { from { transform:translateX(400px); opacity:0; } to { transform:translateX(0); opacity:1; } }
  
  .empty { text-align:center; color:#4b5563; padding:60px 20px; font-style:italic; font-size:15px; }
  
  .detail-img { width:100%; max-height:280px; object-fit:cover; border-radius:12px; margin-bottom:16px; }
  .detail-desc { background:#0a0e17; padding:14px; border-radius:10px; font-size:14px; color:#9ca3af; margin:14px 0; white-space:pre-wrap; line-height:1.6; }
  
  .img-preview { width:100%; max-height:180px; object-fit:contain; border-radius:10px; margin-bottom:10px; background:#0a0e17; display:none; }
  .upload-btn { 
    background:#0a0e17; color:#e8eaed; padding:13px; border-radius:10px;
    text-align:center; cursor:pointer; margin-bottom:12px; font-size:14px;
    border:2px dashed #00c853; font-weight:600; transition:.2s;
  }
  .upload-btn:hover { background:#1f2937; border-color:#00e676; }
  .loading { text-align:center; color:#ffd700; font-size:13px; margin-bottom:10px; font-weight:600; }
  
  .amount-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .amount-grid button {
    padding:11px; background:#0a0e17; color:#e8eaed;
    border:1.5px solid #1f2937; border-radius:9px;
    cursor:pointer; font-size:13px; font-weight:600; transition:.2s;
  }
  .amount-grid button:hover { background:#1f2937; border-color:#00c853; color:#00c853; }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">🔥 SHOP ACC FF <span>CLONE</span></div>
  <div class="user-area" id="userArea"></div>
</header>

<main>
  <div id="products"></div>
</main>

<!-- AUTH MODAL -->
<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2 id="authTitle">Đăng nhập</h2>
    <input id="authName" type="text" placeholder="Tên đăng nhập">
    <input id="authPass" type="password" placeholder="Mật khẩu">
    <button class="btn" id="authBtn" onclick="doAuth()">Đăng nhập</button>
    <div class="link-small">
      <a onclick="forgotPass()">Quên mật khẩu?</a> &nbsp;|&nbsp; 
      <a onclick="toggleAuth()" id="switchAuth">Đăng ký</a>
    </div>
    <div class="admin-link">
      <a onclick="showAdminLogin()">🔐 Đăng nhập Admin</a>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL -->
<div class="modal-bg" id="adminLoginModal">
  <div class="modal">
    <h2>🔐 Đăng nhập Admin</h2>
    <input id="adminUser" type="text" placeholder="Tên admin">
    <input id="adminPass" type="password" placeholder="Mật khẩu admin">
    <button class="btn" onclick="doAdminLogin()">Đăng nhập Admin</button>
    <button class="btn btn-secondary" onclick="closeModal('adminLoginModal')" style="margin-top:8px">Quay lại</button>
  </div>
</div>

<!-- USER PANEL -->
<div class="modal-bg" id="userModal">
  <div class="modal">
    <h2>👤 Tài khoản</h2>
    <div class="balance">
      <div class="label">Số dư hiện tại</div>
      <div class="num" id="userBalance">0đ</div>
    </div>
    <div class="panel-tabs-v">
      <button onclick="showTab('wallet')" id="tabWallet" class="active">💰 Ví & Nạp tiền</button>
      <button onclick="showTab('cart')" id="tabCart">🛒 Giỏ hàng</button>
      <button onclick="showTab('history')" id="tabHistory">📜 Lịch sử mua hàng</button>
    </div>
    <div id="panelContent"></div>
    <button class="btn btn-secondary" onclick="logout()" style="margin-top:18px">Đăng xuất</button>
    <button class="btn btn-secondary" onclick="closeModal('userModal')" style="margin-top:8px">Đóng</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-bg" id="adminModal">
  <div class="modal" style="max-width:620px">
    <h2>🔐 Admin Panel <span class="admin-badge">ADMIN</span></h2>
    <div class="panel-tabs-v">
      <button onclick="showAdminTab('add')" id="atabAdd" class="active">➕ Thêm sản phẩm mới</button>
      <button onclick="showAdminTab('products')" id="atabProducts">📦 Quản lý sản phẩm</button>
      <button onclick="showAdminTab('users')" id="atabUsers">👥 Danh sách user</button>
      <button onclick="showAdminTab('deposits')" id="atabDeposits">💳 Duyệt nạp tiền</button>
      <button onclick="showAdminTab('settings')" id="atabSettings">⚙️ Cài đặt shop</button>
    </div>
    <div id="adminContent"></div>
    <button class="btn btn-secondary" onclick="logout()" style="margin-top:18px">Đăng xuất Admin</button>
    <button class="btn btn-secondary" onclick="closeModal('adminModal')" style="margin-top:8px">Đóng</button>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<div class="modal-bg" id="productModal">
  <div class="modal" id="productModalContent"></div>
</div>

<!-- DEPOSIT MODAL -->
<div class="modal-bg" id="depositModal">
  <div class="modal" id="depositModalContent"></div>
</div>

<!-- ADD ACCOUNT MODAL -->
<div class="modal-bg" id="addAccModal">
  <div class="modal" id="addAccModalContent"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOKxix32T2rC9_TrF9mk6socuR0YCcVno",
  authDomain: "mrphuc-51580.firebaseapp.com",
  databaseURL: "https://mrphuc-51580-default-rtdb.firebaseio.com",
  projectId: "mrphuc-51580",
  storageBucket: "mrphuc-51580.firebasestorage.app",
  messagingSenderId: "922607657180",
  appId: "1:922607657180:web:2d1f482bd5aa562214d419"
};

const IMGBB_KEY = "11fa26a3d2a300961577fa631bfc603c";
const ADMIN_USER = "admin";
const ADMIN_PASS = "phc51580";
const ZALO_LINK = "https://zalo.me/0865561731";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;
let isRegisterMode = false;
let currentTab = 'wallet';
let currentAdminTab = 'add';
let userDataCache = {};
let bankInfo = { bank: 'MBBank', stk: '0865561731', owner: 'PHUC', prefix: 'nap-phuc-' };
let shopLogo = '';

// SESSION
function saveSession(name) { localStorage.setItem('shop_user', name); }
function getSession() { return localStorage.getItem('shop_user'); }
function clearSession() { localStorage.removeItem('shop_user'); }

// NOTIF
window.notif = (msg, isError=false) => {
  const el = document.createElement('div');
  el.className = 'notif' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
};

// SETTINGS
onValue(ref(db, 'settings/bank'), (snap) => { if (snap.val()) bankInfo = snap.val(); });
onValue(ref(db, 'settings/logo'), (snap) => { shopLogo = snap.val() || ''; renderLogo(); });

function renderLogo() {
  const el = document.getElementById('logo');
  if (shopLogo) el.innerHTML = `<img src="${shopLogo}" alt="logo">`;
  else el.innerHTML = `🔥 SHOP ACC FF <span>CLONE</span>`;
}

// ============ AUTH ============
window.toggleAuth = () => { isRegisterMode = !isRegisterMode; updateAuthUI(); };
function updateAuthUI() {
  document.getElementById('authTitle').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
  document.getElementById('authBtn').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
  document.getElementById('switchAuth').textContent = isRegisterMode ? 'Đăng nhập' : 'Đăng ký';
}
function normalizeName(name) { return name.trim().toLowerCase().replace(/[.#$/\[\]]/g, '_'); }

window.doAuth = async () => {
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!name || !pass) return window.notif('Nhập đủ tên và mật khẩu', true);
  if (pass.length < 4) return window.notif('Mật khẩu ít nhất 4 ký tự', true);
  if (name.toLowerCase() === 'admin') return window.notif('Tên này không được dùng!', true);
  
  const key = normalizeName(name);
  const snap = await get(ref(db, 'users/' + key));
  const existing = snap.val();
  
  if (isRegisterMode) {
    if (existing) return window.notif('Tên đã tồn tại!', true);
    await set(ref(db, 'users/' + key), { name, pass, balance: 0, cart: [], history: [], createdAt: Date.now() });
    window.notif('Đăng ký thành công!');
  } else {
    if (!existing) return window.notif('Tên không tồn tại!', true);
    if (existing.pass !== pass) return window.notif('Sai mật khẩu!', true);
    window.notif('Đăng nhập thành công!');
  }
  
  saveSession(key);
  await loadCurrentUser();
  document.getElementById('authModal').classList.remove('show');
  document.getElementById('authName').value = '';
  document.getElementById('authPass').value = '';
};

window.forgotPass = () => {
  if (confirm('Quên mật khẩu?\nBạn sẽ được dẫn đến Zalo để liên hệ admin.')) window.open(ZALO_LINK, '_blank');
};

window.showAdminLogin = () => document.getElementById('adminLoginModal').classList.add('show');

window.doAdminLogin = async () => {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  if (u !== ADMIN_USER || p !== ADMIN_PASS) return window.notif('Sai tên hoặc mật khẩu admin!', true);
  await set(ref(db, 'users/_admin_'), { name: 'ADMIN', pass: ADMIN_PASS, balance: 0, cart: [], history: [], isAdmin: true, createdAt: Date.now() });
  saveSession('_admin_');
  await loadCurrentUser();
  closeModal('adminLoginModal');
  document.getElementById('authModal').classList.remove('show'); // Ẩn form login
  document.getElementById('adminUser').value = '';
  document.getElementById('adminPass').value = '';
  window.notif('👑 Chào Admin!');
  setTimeout(() => window.openAdminPanel(), 500);
};

window.logout = () => {
  clearSession();
  currentUser = null;
  userDataCache = {};
  renderUserArea();
  closeModal('userModal');
  closeModal('adminModal');
  document.getElementById('authModal').classList.add('show');
  isRegisterMode = false;
  updateAuthUI();
  window.notif('Đã đăng xuất');
};

window.closeModal = (id) => document.getElementById(id).classList.remove('show');

async function loadCurrentUser() {
  const key = getSession();
  if (!key) {
    currentUser = null;
    renderUserArea();
    document.getElementById('authModal').classList.add('show');
    return;
  }
  const snap = await get(ref(db, 'users/' + key));
  const data = snap.val();
  if (!data) {
    clearSession();
    currentUser = null;
    renderUserArea();
    document.getElementById('authModal').classList.add('show');
    return;
  }
  currentUser = { key, ...data };
  userDataCache = data;
  renderUserArea();
  // Nếu là admin → ẩn form login, tự mở admin panel
  if (data.isAdmin) {
    document.getElementById('authModal').classList.remove('show');
    setTimeout(() => window.openAdminPanel(), 400);
  } else {
    document.getElementById('authModal').classList.remove('show');
  }
  loadProducts();
}

function renderUserArea() {
  const area = document.getElementById('userArea');
  if (currentUser) {
    const isAdmin = currentUser.isAdmin === true;
    const name = currentUser.name || currentUser.key;
    area.innerHTML = `${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}<div class="user-icon" onclick="openUserPanel()">${name.charAt(0).toUpperCase()}</div>`;
  } else {
    area.innerHTML = '';
  }
}

window.openUserPanel = async () => {
  if (!currentUser) return;
  const snap = await get(ref(db, 'users/' + currentUser.key));
  userDataCache = snap.val() || {};
  currentUser = { key: currentUser.key, ...userDataCache };
  if (userDataCache.isAdmin) { openAdminPanel(); return; }
  document.getElementById('userModal').classList.add('show');
  renderPanel();
};

// ============ USER PANEL ============
window.showTab = (tab) => {
  currentTab = tab;
  ['Wallet','Cart','History'].forEach(t => document.getElementById('tab' + t).classList.toggle('active', t.toLowerCase() === tab));
  renderPanel();
};

function renderPanel() {
  const c = document.getElementById('panelContent');
  const u = userDataCache;
  document.getElementById('userBalance').textContent = (u.balance || 0).toLocaleString() + 'đ';
  
  if (currentTab === 'wallet') {
    c.innerHTML = `
      <div class="deposit-box">
        <h4 style="color:#ffd700;margin-bottom:12px;font-size:15px">💳 Nạp tiền vào ví</h4>
        <p style="font-size:13px;color:#9ca3af;margin-bottom:12px">Chọn nhanh hoặc nhập số tiền (tối thiểu 2.000đ):</p>
        <div class="amount-grid">
          <button onclick="setAmount(10000)">10.000đ</button>
          <button onclick="setAmount(20000)">20.000đ</button>
          <button onclick="setAmount(50000)">50.000đ</button>
          <button onclick="setAmount(100000)">100.000đ</button>
          <button onclick="setAmount(200000)">200.000đ</button>
          <button onclick="setAmount(500000)">500.000đ</button>
        </div>
        <input type="number" id="depositAmount" placeholder="Hoặc nhập số tiền" min="2000">
        <button class="btn" onclick="createDepositCode()" style="margin-top:5px">📝 Tạo mã nạp</button>
      </div>`;
  } else if (currentTab === 'cart') {
    const cart = u.cart || [];
    if (cart.length === 0) { c.innerHTML = '<div class="empty">🛒 Giỏ hàng trống</div>'; return; }
    c.innerHTML = cart.map((id, idx) => `<div class="item-box"><p>SP ID: ${id}</p><button class="btn btn-danger" style="padding:6px;font-size:12px;margin-top:5px" onclick="removeFromCart(${idx})">Xóa</button></div>`).join('');
  } else {
    const hist = u.history || [];
    if (hist.length === 0) { c.innerHTML = '<div class="empty">📜 Chưa có đơn hàng</div>'; return; }
    c.innerHTML = hist.slice().reverse().map(h => `<div class="item-box"><h4>${h.productName}</h4><p>Giá: ${h.price.toLocaleString()}đ</p><p style="color:#00c853;font-weight:600">🔑 Acc: <b>${h.accounts.join(', ')}</b></p><p style="font-size:11px;color:#6b7280;margin-top:4px">${new Date(h.time).toLocaleString('vi-VN')}</p></div>`).join('');
  }
}

window.setAmount = (amt) => { document.getElementById('depositAmount').value = amt; };

window.createDepositCode = async () => {
  const amt = parseInt(document.getElementById('depositAmount').value);
  if (!amt || amt < 2000) return window.notif('Số tiền tối thiểu 2.000đ', true);
  const code = bankInfo.prefix + currentUser.key.slice(0,5).toUpperCase() + '-' + amt;
  await push(ref(db, 'deposits'), { uid: currentUser.key, name: userDataCache.name, amount: amt, code: code, status: 'pending', time: Date.now() });
  document.getElementById('depositModalContent').innerHTML = `
    <h2>💳 Thông tin chuyển khoản</h2>
    <div class="deposit-box">
      <p style="font-size:13px;color:#9ca3af">Số tiền cần chuyển:</p>
      <div style="font-size:26px;color:#ffd700;font-weight:800;margin-bottom:12px">${amt.toLocaleString()}đ</div>
      <p style="font-size:13px;color:#9ca3af">Nội dung CK:</p>
      <div class="code">${code}</div>
      <p style="font-size:13px;color:#9ca3af;margin-top:10px">Ngân hàng: <b style="color:#fff">${bankInfo.bank}</b></p>
      <p style="font-size:13px;color:#9ca3af">Số TK: <b style="color:#fff">${bankInfo.stk}</b></p>
      <p style="font-size:13px;color:#9ca3af">Chủ TK: <b style="color:#fff">${bankInfo.owner}</b></p>
      <p style="font-size:12px;color:#6b7280;margin-top:12px;line-height:1.5">⚠️ Chuyển đúng số tiền và nội dung để admin duyệt nhanh</p>
    </div>
    <button class="btn" onclick="closeModal('depositModal')">✅ Tôi đã chuyển khoản</button>
  `;
  document.getElementById('depositModal').classList.add('show');
  window.notif('Đã tạo mã nạp!');
};

window.removeFromCart = async (idx) => {
  const cart = userDataCache.cart || [];
  cart.splice(idx, 1);
  await update(ref(db, 'users/' + currentUser.key), { cart });
  userDataCache.cart = cart;
  renderPanel();
};

// ============ PRODUCTS ============
window.loadProducts = () => {
  onValue(ref(db, 'products'), (snap) => {
    const data = snap.val() || {};
    const list = Object.entries(data).map(([id, p]) => ({ id, ...p })).reverse();
    const el = document.getElementById('products');
    if (list.length === 0) { el.innerHTML = '<div class="empty">Chưa có sản phẩm nào</div>'; return; }
    el.innerHTML = '<div class="grid">' + list.map(p => {
      const stock = (p.accounts || []).length;
      const out = stock === 0;
      return `
      <div class="card ${out ? 'out-stock' : ''}" onclick="viewProduct('${p.id}')">
        ${p.image ? `<img src="${p.image}">` : `<div class="card-icon">${p.icon || '🎮'}</div>`}
        <div class="card-body">
          <h3>${p.name}</h3>
          <div class="price">${(p.price||0).toLocaleString()}đ</div>
          <div class="stock ${out ? 'out' : ''}">${out ? '❌ Hết hàng' : '📦 Còn: ' + stock + ' acc'}</div>
        </div>
      </div>`;
    }).join('') + '</div>';
  });
};

window.viewProduct = async (id) => {
  const snap = await get(ref(db, 'products/' + id));
  const p = snap.val();
  if (!p) return;
  const stock = (p.accounts || []).length;
  const out = stock === 0;
  document.getElementById('productModalContent').innerHTML = `
    <h2>${p.name}</h2>
    ${p.image ? `<img class="detail-img" src="${p.image}">` : `<div class="card-icon" style="border-radius:12px;margin-bottom:16px">${p.icon||'🎮'}</div>`}
    <div style="font-size:24px;color:#ffd700;font-weight:800;margin-bottom:12px">${(p.price||0).toLocaleString()}đ</div>
    <div class="detail-desc">${p.description || 'Không có mô tả'}</div>
    <p style="color:#9ca3af;font-size:13px;margin-bottom:16px">${out ? '<b style="color:#ef4444">❌ Hết hàng</b>' : `Còn lại: <b style="color:#00c853">${stock}</b> acc`}</p>
    <button class="btn" onclick="buyNow('${id}')" ${out?'disabled style="opacity:.5;cursor:not-allowed"':''}>💰 Mua ngay</button>
    <button class="btn btn-secondary" onclick="addToCart('${id}')" ${out?'disabled style="opacity:.5;cursor:not-allowed"':''}>🛒 Thêm vào giỏ</button>
    <button class="btn btn-secondary" onclick="closeModal('productModal')">Đóng</button>`;
  document.getElementById('productModal').classList.add('show');
};

window.addToCart = async (id) => {
  if (!currentUser) return window.notif('Đăng nhập trước!', true);
  const cart = userDataCache.cart || [];
  if (cart.includes(id)) return window.notif('Đã có trong giỏ', true);
  cart.push(id);
  await update(ref(db, 'users/' + currentUser.key), { cart });
  userDataCache.cart = cart;
  window.notif('Đã thêm vào giỏ');
};

window.buyNow = async (id) => {
  if (!currentUser) return window.notif('Đăng nhập trước!', true);
  const snap = await get(ref(db, 'products/' + id));
  const p = snap.val();
  if (!p) return;
  const stock = (p.accounts || []).length;
  if (stock === 0) return window.notif('Hết hàng!', true);
  if ((userDataCache.balance || 0) < p.price) return window.notif('Số dư không đủ! Vui lòng nạp thêm.', true);
  if (!confirm(`Mua "${p.name}" với giá ${p.price.toLocaleString()}đ?\nSẽ trừ số dư.`)) return;
  const accTaken = p.accounts[0];
  const newAccounts = p.accounts.slice(1);
  await update(ref(db, 'products/' + id), { accounts: newAccounts });
  const newBalance = userDataCache.balance - p.price;
  const history = userDataCache.history || [];
  history.push({ productName: p.name, price: p.price, accounts: [accTaken], time: Date.now() });
  await update(ref(db, 'users/' + currentUser.key), { balance: newBalance, history });
  userDataCache.balance = newBalance;
  userDataCache.history = history;
  alert(`✅ Mua thành công!\n\n🔑 Acc FF của bạn:\n${accTaken}\n\n💵 Số dư còn: ${newBalance.toLocaleString()}đ`);
  closeModal('productModal');
};

// ============ IMGBB ============
async function uploadToImgBB(file) {
  const formData = new FormData();
  formData.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
  const data = await res.json();
  if (data.success) return data.data.url;
  throw new Error(data.error?.message || 'Lỗi upload');
}

window.uploadImage = async (input) => {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('uploadStatus').textContent = '⏳ Đang tải ảnh...';
  try {
    const url = await uploadToImgBB(file);
    document.getElementById('pImage').value = url;
    const preview = document.getElementById('imgPreview');
    preview.src = url;
    preview.style.display = 'block';
    document.getElementById('uploadStatus').textContent = '✅ Tải ảnh thành công!';
  } catch (e) {
    document.getElementById('uploadStatus').textContent = '❌ Lỗi: ' + e.message;
  }
};

window.uploadLogo = async (input) => {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('logoStatus').textContent = '⏳ Đang tải...';
  try {
    const url = await uploadToImgBB(file);
    await set(ref(db, 'settings/logo'), url);
    shopLogo = url;
    renderLogo();
    document.getElementById('logoStatus').textContent = '✅ Đã đổi logo!';
  } catch (e) {
    document.getElementById('logoStatus').textContent = '❌ Lỗi: ' + e.message;
  }
};

window.resetLogo = async () => {
  if (!confirm('Xóa logo, dùng chữ mặc định?')) return;
  await remove(ref(db, 'settings/logo'));
  shopLogo = '';
  renderLogo();
  window.notif('Đã reset logo');
};

// ============ ADMIN ============
window.openAdminPanel = () => {
  document.getElementById('adminModal').classList.add('show');
  showAdminTab('add');
};

window.showAdminTab = (tab) => {
  currentAdminTab = tab;
  ['add','products','users','deposits','settings'].forEach(t => {
    const el = document.getElementById('atab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.classList.toggle('active', t === tab);
  });
  renderAdminPanel();
};

async function renderAdminPanel() {
  const c = document.getElementById('adminContent');
  if (currentAdminTab === 'add') {
    c.innerHTML = `
      <input id="pName" placeholder="Tên acc (VD: Acc FF Cao Thủ)">
      <div class="upload-btn" onclick="document.getElementById('pFile').click()">📷 Chọn ảnh từ máy</div>
      <input type="file" id="pFile" accept="image/*" style="display:none" onchange="uploadImage(this)">
      <div class="loading" id="uploadStatus"></div>
      <img class="img-preview" id="imgPreview">
      <input id="pImage" placeholder="Hoặc dán link ảnh">
      <input id="pIcon" placeholder="Hoặc icon emoji (VD: 🎮🔥⚔️)">
      <input id="pPrice" type="number" placeholder="Giá (VNĐ)">
      <textarea id="pDesc" placeholder="Mô tả sản phẩm"></textarea>
      <textarea id="pAccounts" placeholder="Danh sách acc FF (mỗi acc 1 dòng):&#10;user1|pass1&#10;user2|pass2"></textarea>
      <button class="btn" onclick="addProduct()">➕ Tạo sản phẩm</button>`;
  } else if (currentAdminTab === 'products') {
    const snap = await get(ref(db, 'products'));
    const data = snap.val() || {};
    const list = Object.entries(data).map(([id, p]) => ({ id, ...p }));
    c.innerHTML = list.length === 0 ? '<div class="empty">Chưa có SP</div>' : list.map(p => {
      const stock = (p.accounts || []).length;
      return `
      <div class="item-box">
        <h4>${p.name} ${stock===0?'<span style="color:#ef4444">(Hết hàng)</span>':''}</h4>
        <p>Giá: ${(p.price||0).toLocaleString()}đ</p>
        <p>Còn: <b style="color:${stock>0?'#00c853':'#ef4444'}">${stock} acc</b></p>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <button class="btn" style="padding:7px;font-size:12px;width:auto;flex:1" onclick="openAddAcc('${p.id}','${p.name}')">➕ Thêm acc</button>
          <button class="btn btn-danger" style="padding:7px;font-size:12px;width:auto;flex:1" onclick="deleteProduct('${p.id}')">🗑 Xóa SP</button>
        </div>
      </div>`;
    }).join('');
  } else if (currentAdminTab === 'users') {
    const snap = await get(ref(db, 'users'));
    const data = snap.val() || {};
    const list = Object.entries(data).filter(([k]) => !k.startsWith('_admin')).map(([id, u]) => ({ id, ...u }));
    c.innerHTML = list.length === 0 ? '<div class="empty">Chưa có user</div>' : list.map(u => `
      <div class="item-box">
        <h4>${u.name || 'No name'} ${u.isAdmin ? '👑' : ''}</h4>
        <p style="color:#ffd700">Số dư: ${(u.balance||0).toLocaleString()}đ</p>
      </div>`).join('');
  } else if (currentAdminTab === 'deposits') {
    const snap = await get(ref(db, 'deposits'));
    const data = snap.val() || {};
    const list = Object.entries(data).map(([id, d]) => ({ id, ...d })).filter(d => d.status === 'pending').reverse();
    c.innerHTML = list.length === 0 ? '<div class="empty">Không có đơn nạp chờ duyệt</div>' : list.map(d => `
      <div class="item-box">
        <h4>👤 ${d.name}</h4>
        <p>Số tiền: <b style="color:#ffd700">${(d.amount||0).toLocaleString()}đ</b></p>
        <p style="font-size:11px;color:#6b7280">Mã: ${d.code || 'N/A'}</p>
        <p style="font-size:11px;color:#6b7280">${new Date(d.time).toLocaleString('vi-VN')}</p>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn" style="padding:8px;font-size:12px;flex:1" onclick="approveDeposit('${d.id}','${d.uid}',${d.amount})">✅ Duyệt +${(d.amount||0).toLocaleString()}đ</button>
          <button class="btn btn-danger" style="padding:8px;font-size:12px;flex:1" onclick="rejectDeposit('${d.id}')">❌ Từ chối</button>
        </div>
      </div>`).join('');
  } else if (currentAdminTab === 'settings') {
    const snap = await get(ref(db, 'settings/bank'));
    const b = snap.val() || bankInfo;
    c.innerHTML = `
      <p style="color:#ffd700;margin-bottom:12px;font-weight:700">🖼️ Logo Shop</p>
      ${shopLogo ? `<img src="${shopLogo}" style="max-width:100%;max-height:100px;border-radius:10px;margin-bottom:10px">` : '<p style="font-size:12px;color:#6b7280;margin-bottom:10px">Chưa có logo</p>'}
      <div class="upload-btn" onclick="document.getElementById('logoFile').click()">📷 Chọn ảnh logo mới</div>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="uploadLogo(this)">
      <div class="loading" id="logoStatus"></div>
      <button class="btn btn-secondary" onclick="resetLogo()" style="margin-bottom:22px">🔄 Reset logo</button>
      
      <p style="color:#ffd700;margin-bottom:12px;font-weight:700">💳 Thông tin ngân hàng</p>
      <input id="setBank" placeholder="Tên ngân hàng" value="${b.bank || ''}">
      <input id="setStk" placeholder="Số tài khoản" value="${b.stk || ''}">
      <input id="setOwner" placeholder="Chủ tài khoản" value="${b.owner || ''}">
      <input id="setPrefix" placeholder="Tiền tố nội dung CK" value="${b.prefix || ''}">
      <button class="btn" onclick="saveBankInfo()">💾 Lưu cài đặt</button>`;
  }
}

window.openAddAcc = (id, name) => {
  document.getElementById('addAccModalContent').innerHTML = `
    <h2>➕ Thêm acc vào "${name}"</h2>
    <p style="font-size:13px;color:#9ca3af;margin-bottom:12px">Nhập acc FF mới, mỗi acc 1 dòng (dạng: user|pass)</p>
    <textarea id="newAccs" placeholder="user1|pass1&#10;user2|pass2" style="min-height:120px"></textarea>
    <button class="btn" onclick="addAccToProduct('${id}')">➕ Thêm acc</button>
    <button class="btn btn-secondary" onclick="closeModal('addAccModal')" style="margin-top:8px">Đóng</button>
  `;
  document.getElementById('addAccModal').classList.add('show');
};

window.addAccToProduct = async (id) => {
  const text = document.getElementById('newAccs').value.trim();
  if (!text) return window.notif('Nhập acc FF', true);
  const newAccs = text.split('\n').map(l => l.trim()).filter(l => l);
  const snap = await get(ref(db, 'products/' + id));
  const p = snap.val();
  const oldAccs = p.accounts || [];
  await update(ref(db, 'products/' + id), { accounts: [...oldAccs, ...newAccs] });
  window.notif(`Đã thêm ${newAccs.length} acc!`);
  closeModal('addAccModal');
  renderAdminPanel();
};

window.saveBankInfo = async () => {
  const bank = document.getElementById('setBank').value.trim();
  const stk = document.getElementById('setStk').value.trim();
  const owner = document.getElementById('setOwner').value.trim();
  const prefix = document.getElementById('setPrefix').value.trim();
  await set(ref(db, 'settings/bank'), { bank, stk, owner, prefix });
  bankInfo = { bank, stk, owner, prefix };
  window.notif('Đã lưu!');
};

window.addProduct = async () => {
  const name = document.getElementById('pName').value.trim();
  const image = document.getElementById('pImage').value.trim();
  const icon = document.getElementById('pIcon').value.trim();
  const price = parseInt(document.getElementById('pPrice').value);
  const description = document.getElementById('pDesc').value.trim();
  const accText = document.getElementById('pAccounts').value.trim();
  if (!name || !price) return window.notif('Nhập tên và giá', true);
  const accounts = accText.split('\n').map(l => l.trim()).filter(l => l);
  await push(ref(db, 'products'), { name, image, icon, price, description, accounts, createdAt: Date.now() });
  window.notif('Đã thêm sản phẩm!');
  ['pName','pImage','pIcon','pPrice','pDesc','pAccounts'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('uploadStatus').textContent = '';
};

window.deleteProduct = async (id) => {
  if (!confirm('Xóa sản phẩm này?')) return;
  await remove(ref(db, 'products/' + id));
  window.notif('Đã xóa');
  renderAdminPanel();
};

window.approveDeposit = async (depositId, uid, amount) => {
  const snap = await get(ref(db, 'users/' + uid));
  const u = snap.val();
  if (!u) return window.notif('User không tồn tại', true);
  await update(ref(db, 'users/' + uid), { balance: (u.balance || 0) + amount });
  await update(ref(db, 'deposits/' + depositId), { status: 'approved', approvedAt: Date.now() });
  window.notif('Đã duyệt +' + amount.toLocaleString() + 'đ');
  renderAdminPanel();
};

window.rejectDeposit = async (depositId) => {
  if (!confirm('Từ chối đơn này?')) return;
  await update(ref(db, 'deposits/' + depositId), { status: 'rejected' });
  window.notif('Đã từ chối');
  renderAdminPanel();
};

// INIT
loadCurrentUser();
updateAuthUI();
</script>
