<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Acc FF Clone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:#0a0e17; color:#e8eaed; min-height:100vh; line-height:1.5; }
  
  header {
    background:linear-gradient(135deg,#00c853 0%,#00a844 100%);
    padding:14px 20px; display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:100;
    box-shadow:0 4px 20px rgba(0,200,83,.35);
  }
  .logo { font-size:19px; font-weight:800; cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; color:#fff; letter-spacing:.5px; }
  .logo span { color:#ffd700; }
  .logo img { max-height:42px; max-width:170px; object-fit:contain; }
  .user-area { display:flex; gap:10px; align-items:center; }
  .user-icon { 
    width:42px; height:42px; border-radius:50%; background:#fff; color:#00a844;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; cursor:pointer;
    border:2.5px solid #ffd700; box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:.2s;
  }
  .user-icon:hover { transform:scale(1.08); }
  
  main { padding:14px; max-width:1200px; margin:0 auto; padding-bottom:100px; }
  
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:10px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3,1fr); gap:14px; } }
  @media (min-width:1024px) { .grid { grid-template-columns:repeat(4,1fr); gap:16px; } }
  
  .card {
    background:#131826; border-radius:12px; overflow:hidden;
    border:1px solid #1f2937; transition:.25s ease; cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25); position:relative;
  }
  .card:hover { transform:translateY(-4px); border-color:#00c853; box-shadow:0 10px 24px rgba(0,200,83,.3); }
  .card .img-wrap { width:100%; aspect-ratio:1/1; overflow:hidden; background:#1f2937; position:relative; }
  .card .img-wrap img { width:100%; height:100%; object-fit:cover; }
  .card .img-wrap .icon-placeholder {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:60px; background:linear-gradient(135deg,#1f2937,#131826);
  }
  .card .price-bar {
    padding:8px 10px; background:linear-gradient(135deg,#0a0e17,#131826);
    text-align:center; border-top:1px solid #1f2937;
  }
  .card .price-bar .price { color:#ffd700; font-size:15px; font-weight:800; }
  .card .out-label {
    position:absolute; top:8px; left:8px; background:rgba(239,68,68,.95); color:#fff;
    padding:3px 8px; border-radius:6px; font-size:10px; font-weight:800;
  }
  .card .stock-label {
    position:absolute; top:8px; right:8px; background:rgba(0,200,83,.95); color:#fff;
    padding:3px 8px; border-radius:6px; font-size:10px; font-weight:800;
  }
  .card.out-stock .img-wrap { filter:grayscale(.6); }
  .card.out-stock:hover { border-color:#ef4444; }
  
  /* BẢNG XẾP HẠNG */
  .rank-section { margin-top:30px; }
  .rank-section h2 { color:#ffd700; font-size:20px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .rank-list { display:flex; flex-direction:column; gap:8px; }
  .rank-item {
    background:#131826; border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; gap:12px;
    border:1px solid #1f2937; transition:.2s;
  }
  .rank-item:hover { border-color:#00c853; }
  .rank-item.top1 { background:linear-gradient(135deg,#3d2f00,#131826); border-color:#ffd700; box-shadow:0 4px 16px rgba(255,215,0,.2); }
  .rank-item.top2 { background:linear-gradient(135deg,#2a2a2a,#131826); border-color:#c0c0c0; }
  .rank-item.top3 { background:linear-gradient(135deg,#2a1e0e,#131826); border-color:#cd7f32; }
  .rank-item .rank-num {
    width:36px; height:36px; border-radius:50%; background:#0a0e17;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#ffd700; flex-shrink:0;
    border:1.5px solid #1f2937;
  }
  .rank-item.top1 .rank-num { background:linear-gradient(135deg,#ffd700,#ffb700); color:#000; border-color:#ffd700; }
  .rank-item.top2 .rank-num { background:linear-gradient(135deg,#e0e0e0,#a0a0a0); color:#000; border-color:#e0e0e0; }
  .rank-item.top3 .rank-num { background:linear-gradient(135deg,#cd7f32,#8b5a2b); color:#fff; border-color:#cd7f32; }
  .rank-item .rank-avatar {
    width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#00c853,#00a844);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#fff; flex-shrink:0;
  }
  .rank-item .rank-info { flex:1; min-width:0; }
  .rank-item .rank-name { font-weight:700; font-size:14px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-item .rank-amount { font-size:12px; color:#ffd700; font-weight:700; }
  
  /* CONTACT BUTTON */
  .contact-float {
    position:fixed; bottom:20px; right:20px;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#00c853,#00a844);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,200,83,.5);
    z-index:998; transition:.2s;
    border:3px solid #fff;
  }
  .contact-float:hover { transform:scale(1.1); }
  .contact-float::after {
    content:''; position:absolute; inset:-3px;
    border-radius:50%; border:2px solid #00c853;
    animation:pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform:scale(1); opacity:1; }
    100% { transform:scale(1.4); opacity:0; }
  }
  
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; justify-content:center; align-items:center; z-index:999; padding:15px; backdrop-filter:blur(4px); }
  .modal-bg.show { display:flex; animation:fadeIn .2s; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal { 
    background:#131826; border-radius:18px; padding:22px; max-width:460px; width:100%;
    max-height:90vh; overflow-y:auto; border:1px solid #1f2937;
    box-shadow:0 20px 60px rgba(0,0,0,.6); animation:slideUp .3s;
  }
  @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal h2 { margin-bottom:16px; color:#00c853; font-size:20px; font-weight:800; }
  .modal input, .modal textarea, .modal select {
    width:100%; padding:12px 14px; background:#0a0e17;
    border:1.5px solid #1f2937; border-radius:10px;
    color:#fff; margin-bottom:10px; font-size:14px;
  }
  .modal input:focus, .modal textarea:focus { outline:none; border-color:#00c853; box-shadow:0 0 0 3px rgba(0,200,83,.15); }
  .modal textarea { min-height:80px; resize:vertical; font-family:inherit; }
  .modal .btn {
    width:100%; padding:12px; background:linear-gradient(135deg,#00c853,#00a844);
    color:#fff; border:none; border-radius:10px;
    font-weight:700; cursor:pointer; font-size:15px; margin-top:5px;
    transition:.2s; box-shadow:0 4px 12px rgba(0,200,83,.3);
  }
  .modal .btn:hover { transform:translateY(-2px); }
  .modal .btn-secondary { background:#1f2937; box-shadow:none; }
  .modal .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); }
  .modal .btn-warning { background:linear-gradient(135deg,#f59e0b,#d97706); }
  
  .link-small { text-align:center; margin-top:14px; font-size:13px; }
  .link-small a { color:#ffd700; cursor:pointer; text-decoration:none; font-weight:600; }
  .link-small a:hover { text-decoration:underline; }
  .admin-link { text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid #1f2937; }
  .admin-link a { color:#6b7280; font-size:12px; cursor:pointer; text-decoration:none; }
  .admin-link a:hover { color:#ffd700; }
  
  .panel-tabs-v { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .panel-tabs-v button {
    padding:12px 16px; background:#0a0e17; color:#e8eaed;
    border:1.5px solid #1f2937; border-radius:10px;
    cursor:pointer; font-size:14px; text-align:left; font-weight:600;
    transition:.2s;
  }
  .panel-tabs-v button:hover { background:#1f2937; }
  .panel-tabs-v button.active { background:linear-gradient(135deg,#00c853,#00a844); border-color:#00c853; color:#fff; }
  
  .item-box { background:#0a0e17; padding:12px; border-radius:10px; margin-bottom:10px; border-left:3px solid #00c853; }
  .item-box h4 { font-size:14px; margin-bottom:5px; color:#ffd700; font-weight:700; }
  .item-box p { font-size:13px; color:#9ca3af; }
  .item-box.rejected { border-left-color:#ef4444; }
  .item-box.approved { border-left-color:#00c853; }
  .item-box.pending { border-left-color:#f59e0b; }
  
  .balance { background:linear-gradient(135deg,#00c853,#00a844); padding:20px; border-radius:14px; text-align:center; margin-bottom:18px; }
  .balance .label { font-size:13px; color:rgba(255,255,255,.85); }
  .balance .num { font-size:32px; font-weight:800; color:#ffd700; margin-top:4px; }
  
  .admin-badge { background:linear-gradient(135deg,#ffd700,#ffb700); color:#000; padding:5px 11px; border-radius:14px; font-size:11px; font-weight:800; }
  
  .deposit-box { background:#0a0e17; padding:14px; border-radius:12px; margin-bottom:14px; border:1.5px solid #1f2937; }
  .deposit-box .code { 
    background:#131826; padding:12px; border-radius:10px;
    font-family:'Courier New',monospace; font-size:15px; color:#ffd700;
    margin:8px 0; word-break:break-all; text-align:center;
    border:1.5px dashed #00c853; font-weight:700;
  }
  .qr-img { width:100%; max-width:300px; margin:0 auto 12px; display:block; border-radius:12px; background:#fff; padding:8px; }
  
  .notif { 
    position:fixed; top:80px; right:20px;
    background:linear-gradient(135deg,#00c853,#00a844); color:#fff;
    padding:14px 22px; border-radius:12px; font-weight:700; font-size:14px;
    z-index:9999; animation:slideIn .3s; box-shadow:0 8px 24px rgba(0,200,83,.4);
    max-width:280px;
  }
  .notif.error { background:linear-gradient(135deg,#ef4444,#dc2626); }
  @keyframes slideIn { from { transform:translateX(400px); opacity:0; } to { transform:translateX(0); opacity:1; } }
  
  .empty { text-align:center; color:#4b5563; padding:60px 20px; font-style:italic; font-size:15px; }
  
  .detail-img { width:100%; max-height:280px; object-fit:cover; border-radius:12px; margin-bottom:14px; }
  .detail-desc { background:#0a0e17; padding:12px; border-radius:10px; font-size:14px; color:#9ca3af; margin:12px 0; white-space:pre-wrap; line-height:1.6; }
  
  .img-preview { width:100%; max-height:180px; object-fit:contain; border-radius:10px; margin-bottom:10px; background:#0a0e17; display:none; }
  .upload-btn { 
    background:#0a0e17; color:#e8eaed; padding:12px; border-radius:10px;
    text-align:center; cursor:pointer; margin-bottom:12px; font-size:14px;
    border:2px dashed #00c853; font-weight:600; transition:.2s;
  }
  .upload-btn:hover { background:#1f2937; border-color:#00e676; }
  .loading { text-align:center; color:#ffd700; font-size:13px; margin-bottom:10px; font-weight:600; }
  
  .amount-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .amount-grid button {
    padding:10px; background:#0a0e17; color:#e8eaed;
    border:1.5px solid #1f2937; border-radius:9px;
    cursor:pointer; font-size:13px; font-weight:600; transition:.2s;
  }
  .amount-grid button:hover { background:#1f2937; border-color:#00c853; color:#00c853; }
  
  .acc-list { background:#0a0e17; border-radius:10px; padding:10px; margin-bottom:12px; max-height:200px; overflow-y:auto; }
  .acc-list .acc-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; background:#131826; border-radius:8px;
    margin-bottom:6px; font-family:monospace; font-size:13px;
  }
  .acc-list .acc-item span { color:#00c853; word-break:break-all; flex:1; margin-right:8px; }
  .acc-list .acc-item button {
    background:#ef4444; color:#fff; border:none; border-radius:6px;
    padding:4px 8px; font-size:11px; cursor:pointer; font-weight:700;
  }
  .acc-list .acc-empty { text-align:center; color:#4b5563; font-size:12px; padding:10px; font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">🔥 SHOP ACC FF <span>CLONE</span></div>
  <div class="user-area" id="userArea"></div>
</header>

<main>
  <div id="products"></div>
  <div id="rankSection"></div>
</main>

<!-- NÚT LIÊN HỆ -->
<div class="contact-float" onclick="contactAdmin()" title="Liên hệ Admin">💬</div>

<!-- AUTH MODAL -->
<div class="modal-bg" id="authModal">
  <div class="modal">
    <h2 id="authTitle">Đăng nhập</h2>
    <input id="authName" type="text" placeholder="Tên đăng nhập">
    <input id="authPass" type="password" placeholder="Mật khẩu">
    <button class="btn" id="authBtn" onclick="doAuth()">Đăng nhập</button>
    <div class="link-small">
      <a onclick="forgotPass()">Quên mật khẩu?</a> &nbsp;|&nbsp; 
      <a onclick="toggleAuth()" id="switchAuth">Đăng ký</a>
    </div>
    <div class="admin-link">
      <a onclick="showAdminLogin()">🔐 Đăng nhập Admin</a>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL -->
<div class="modal-bg" id="adminLoginModal">
  <div class="modal">
    <h2>🔐 Đăng nhập Admin</h2>
    <input id="adminUser" type="text" placeholder="Tên admin">
    <input id="adminPass" type="password" placeholder="Mật khẩu admin">
    <button class="btn" onclick="doAdminLogin()">Đăng nhập Admin</button>
    <button class="btn btn-secondary" onclick="closeModal('adminLoginModal')" style="margin-top:8px">Quay lại</button>
  </div>
</div>

<!-- USER PANEL -->
<div class="modal-bg" id="userModal">
  <div class="modal">
    <h2>👤 Tài khoản</h2>
    <div class="balance">
      <div class="label">Số dư hiện tại</div>
      <div class="num" id="userBalance">0đ</div>
    </div>
    <div class="panel-tabs-v">
      <button onclick="showTab('wallet')" id="tabWallet" class="active">💰 Ví & Nạp tiền</button>
      <button onclick="showTab('cart')" id="tabCart">🛒 Giỏ hàng</button>
      <button onclick="showTab('history')" id="tabHistory">📜 Lịch sử mua hàng</button>
      <button onclick="showTab('deposits')" id="tabDeposits">💳 Lịch sử nạp tiền</button>
    </div>
    <div id="panelContent"></div>
    <button class="btn btn-secondary" onclick="logout()" style="margin-top:18px">Đăng xuất</button>
    <button class="btn btn-secondary" onclick="closeModal('userModal')" style="margin-top:8px">Đóng</button>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-bg" id="adminModal">
  <div class="modal" style="max-width:620px">
    <h2>🔐 Admin Panel <span class="admin-badge">ADMIN</span></h2>
    <div class="panel-tabs-v">
      <button onclick="showAdminTab('add')" id="atabAdd" class="active">➕ Thêm sản phẩm</button>
      <button onclick="showAdminTab('products')" id="atabProducts">📦 Quản lý sản phẩm</button>
      <button onclick="showAdminTab('users')" id="atabUsers">👥 Danh sách user</button>
      <button onclick="showAdminTab('deposits')" id="atabDeposits">💳 Duyệt nạp tiền</button>
      <button onclick="showAdminTab('deposit')" id="atabDeposit">💰 Nạp tiền</button>
      <button onclick="showAdminTab('settings')" id="atabSettings">⚙️ Cài đặt shop</button>
    </div>
    <div id="adminContent"></div>
    <button class="btn btn-secondary" onclick="logout()" style="margin-top:18px">Đăng xuất Admin</button>
    <button class="btn btn-secondary" onclick="closeModal('adminModal')" style="margin-top:8px">Đóng</button>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<div class="modal-bg" id="productModal">
  <div class="modal" id="productModalContent"></div>
</div>

<!-- DEPOSIT MODAL -->
<div class="modal-bg" id="depositModal">
  <div class="modal" id="depositModalContent"></div>
</div>

<!-- ADD ACCOUNT MODAL -->
<div class="modal-bg" id="addAccModal">
  <div class="modal" id="addAccModalContent"></div>
</div>

<!-- CONTACT MODAL -->
<div class="modal-bg" id="contactModal">
  <div class="modal">
    <h2>💬 Liên hệ Admin</h2>
    <p style="font-size:14px;color:#9ca3af;margin-bottom:16px;text-align:center">Bạn cần hỗ trợ? Liên hệ ngay:</p>
    <div class="deposit-box" style="text-align:center">
      <p style="font-size:13px;color:#9ca3af;margin-bottom:6px">Zalo / SĐT Admin</p>
      <div class="code" style="font-size:22px">0865561731</div>
    </div>
    <button class="btn" onclick="openZalo()">💬 Chat Zalo</button>
    <button class="btn btn-secondary" onclick="window.location.href='tel:0865561731'" style="margin-top:8px">📞 Gọi điện</button>
    <button class="btn btn-secondary" onclick="closeModal('contactModal')" style="margin-top:8px">Đóng</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOKxix32T2rC9_TrF9mk6socuR0YCcVno",
  authDomain: "mrphuc-51580.firebaseapp.com",
  databaseURL: "https://mrphuc-51580-default-rtdb.firebaseio.com",
  projectId: "mrphuc-51580",
  storageBucket: "mrphuc-51580.firebasestorage.app",
  messagingSenderId: "922607657180",
  appId: "1:922607657180:web:2d1f482bd5aa562214d419"
};

const IMGBB_KEY = "11fa26a3d2a300961577fa631bfc603c";
const ADMIN_USER = "admin";
const ADMIN_PASS = "phc51580";
const ADMIN_PHONE = "0865561731";
const ZALO_LINK = "https://zalo.me/" + ADMIN_PHONE;

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentUser = null;
let isRegisterMode = false;
let currentTab = 'wallet';
let currentAdminTab = 'add';
let userDataCache = {};
let bankInfo = { bank: 'MBBank', stk: ADMIN_PHONE, owner: 'PHUC', prefix: 'nap-phuc-', qr: '' };
let shopLogo = '';

let tempAccList = [];
let tempAccProductId = '';
let tempNewProductAccs = [];

// SESSION
function saveSession(name) { localStorage.setItem('shop_user', name); }
function getSession() { return localStorage.getItem('shop_user'); }
function clearSession() { localStorage.removeItem('shop_user'); }

// NOTIF
window.notif = (msg, isError=false) => {
  const el = document.createElement('div');
  el.className = 'notif' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
};

// CONTACT
window.contactAdmin = () => document.getElementById('contactModal').classList.add('show');
window.openZalo = () => { window.open(ZALO_LINK, '_blank'); closeModal('contactModal'); };

// SETTINGS
onValue(ref(db, 'settings/bank'), (snap) => { if (snap.val()) bankInfo = { ...bankInfo, ...snap.val() }; });
onValue(ref(db, 'settings/logo'), (snap) => { shopLogo = snap.val() || ''; renderLogo(); });

function renderLogo() {
  const el = document.getElementById('logo');
  if (shopLogo) el.innerHTML = `<img src="${shopLogo}" alt="logo">`;
  else el.innerHTML = `🔥 SHOP ACC FF <span>CLONE</span>`;
}

// ============ AUTH ============
window.toggleAuth = () => { isRegisterMode = !isRegisterMode; updateAuthUI(); };
function updateAuthUI() {
  document.getElementById('authTitle').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
  document.getElementById('authBtn').textContent = isRegisterMode ? 'Đăng ký' : 'Đăng nhập';
  document.getElementById('switchAuth').textContent = isRegisterMode ? 'Đăng nhập' : 'Đăng ký';
}
function normalizeName(name) { return name.trim().toLowerCase().replace(/[.#$/\[\]]/g, '_'); }

window.doAuth = async () => {
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!name || !pass) return window.notif('Nhập đủ tên và mật khẩu', true);
  if (pass.length < 4) return window.notif('Mật khẩu ít nhất 4 ký tự', true);
  if (name.toLowerCase() === 'admin') return window.notif('Tên này không được dùng!', true);
  
  const key = normalizeName(name);
  const snap = await get(ref(db, 'users/' + key));
  const existing = snap.val();
  
  if (isRegisterMode) {
    if (existing) return window.notif('Tên đã tồn tại!', true);
    await set(ref(db, 'users/' + key), { name, pass, balance: 0, totalDeposited: 0, cart: [], history: [], createdAt: Date.now() });
    window.notif('Đăng ký thành công!');
  } else {
    if (!existing) return window.notif('Tên không tồn tại!', true);
    if (existing.pass !== pass) return window.notif('Sai mật khẩu!', true);

  }

  await loadCurrentUser();
  document.getElementById('authModal').classList.remove('show');
  document.getElementById('authName').value = '';
  document.getElementById('authPass').value = '';
};

async function loadCurrentUser() {
  const key = getSession();
  if (!key) {
    currentUser = null;
    renderUserArea();
    document.getElementById('authModal').classList.add('show');
    loadProducts();
    loadRanking();
    return;
  }
  const snap = await get(ref(db, 'users/' + key));
  const data = snap.val();
  if (!data) {
    clearSession();
    currentUser = null;
    renderUserArea();
    document.getElementById('authModal').classList.add('show');
    loadProducts();
    loadRanking();
    return;
  }
  currentUser = { key, ...data };
  userDataCache = data;
  renderUserArea();
  if (data.isAdmin) {
    document.getElementById('authModal').classList.remove('show');
    setTimeout(() => window.openAdminPanel(), 400);
  } else {
    document.getElementById('authModal').classList.remove('show');
  }
  loadProducts();
  loadRanking();
}

function renderUserArea() {
  const area = document.getElementById('userArea');
  if (currentUser) {

  const out = stock === 0;
  document.getElementById('productModalContent').innerHTML = `

    ${p.image ? `<img class="detail-img" src="${p.image}">` : `<div class="card-icon" style="border-radius:12px;margin-bottom:14px">${p.icon||'🎮'}</div>`}

window.addToCart = async (id) => {
  if (!currentUser) return window.notif('Đăng nhập trước!', true);
  const cart = userDataCache.cart || [];
  if (cart.includes(id)) return window.notif('Đã có trong giỏ', true);
  cart.push(id);
  await update(ref(db, 'users/' + currentUser.key), { cart });
  userDataCache.cart = cart;
  window.notif('Đã thêm vào giỏ');
};

window.buyNow = async (id) => {
  if (!currentUser) return window.notif('Đăng nhập trước!', true);
  const snap = await get(ref(db, 'products/' + id));
  const p = snap.val();
  if (!p) return;
  const stock = (p.accounts || []).length;
  if (stock === 0) return window.notif('Hết hàng!', true);
  if ((userDataCache.balance || 0) < p.price) return window.notif('Số dư không đủ! Vui lòng nạp thêm.', true);
  if (!confirm(`Mua "${p.name}" với giá ${p.price.toLocaleString()}đ?\nSẽ trừ số dư.`)) return;
  const accTaken = p.accounts[0];
  const newAccounts = p.accounts.slice(1);
  await update(ref(db, 'products/' + id), { accounts: newAccounts });
  const newBalance = userDataCache.balance - p.price;
  const history = userDataCache.history || [];
  history.push({ productName: p.name, price: p.price, accounts: [accTaken], time: Date.now() });
  await update(ref(db, 'users/' + currentUser.key), { balance: newBalance, history });
  userDataCache.balance = newBalance;
  userDataCache.history = history;
  alert(`✅ Mua thành công!\n\n🔑 Acc FF của bạn:\n${accTaken}\n\n💵 Số dư còn: ${newBalance.toLocaleString()}đ`);
  closeModal('productModal');
};

// ============ IMGBB ============
async function uploadToImgBB(file) {
  const formData = new FormData();
  formData.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
  const data = await res.json();
  if (data.success) return data.data.url;
  throw new Error(data.error?.message || 'Lỗi upload');
}

window.uploadImage = async (input) => {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('uploadStatus').textContent = '⏳ Đang tải ảnh...';
  try {
    const url = await uploadToImgBB(file);
    document.getElementById('pImage').value = url;
    const preview = document.getElementById('imgPreview');
    preview.src = url;
    preview.style.display = 'block';
    document.getElementById('uploadStatus').textContent = '✅ Tải ảnh thành công!';
  } catch (e) {
    document.getElementById('uploadStatus').textContent = '❌ Lỗi: ' + e.message;
  }
};

        <div class="num">${(u.balance||0).toLocaleString()}đ</div>
      </div>
      <div class="deposit-box">
        <h4 style="color:#ffd700;margin-bottom:12px;font-size:15px">💰 Nạp tiền vào ví Admin</h4>
        <p style="font-size:13px;color:#9ca3af;margin-bottom:12px">Nhập số tiền muốn nạp (tối thiểu 2.000đ):</p>
        <input type="number" id="adminDepositAmount" placeholder="Nhập số tiền" min="2000">
        <button class="btn" onclick="adminDepositSelf()">➕ Cộng tiền vào ví</button>
      </div>`;
  } else if (currentAdminTab === 'settings') {
    const snap = await get(ref(db, 'settings/bank'));
    const b = snap.val() || bankInfo;
    c.innerHTML = `
      <p style="color:#ffd700;margin-bottom:12px;font-weight:700">🖼️ Logo Shop</p>
      ${shopLogo ? `<img src="${shopLogo}" style="max-width:100%;max-height:100px;border-radius:10px;margin-bottom:10px">` : '<p style="font-size:12px;color:#6b7280;margin-bottom:10px">Chưa có logo</p>'}
      <div class="upload-btn" onclick="document.getElementById('logoFile').click()">📷 Chọn ảnh logo mới</div>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="uploadLogo(this)">
      <div class="loading" id="logoStatus"></div>
      <button class="btn btn-secondary" onclick="resetLogo()" style="margin-bottom:22px">🔄 Reset logo</button>
      
      <p style="color:#ffd700;margin-bottom:12px;font-weight:700">📱 Ảnh QR Ngân hàng</p>
      ${b.qr ? `<img src="${b.qr}" style="max-width:100%;max-height:200px;border-radius:10px;margin-bottom:10px;background:#fff;padding:6px">` : '<p style="font-size:12px;color:#6b7280;margin-bottom:10px">Chưa có ảnh QR</p>'}
      <div class="upload-btn" onclick="document.getElementById('qrFile').click()">📷 Chọn ảnh QR mới</div>
      <input type="file" id="qrFile" accept="image/*" style="display:none" onchange="uploadQR(this)">
      <div class="loading" id="qrStatus"></div>
      ${b.qr ? `<button class="btn btn-danger" onclick="removeQR()" style="margin-bottom:22px">🗑 Xóa ảnh QR</button>` : ''}
      
      <p style="color:#ffd700;margin-bottom:12px;font-weight:700">💳 Thông tin ngân hàng</p>
      <input id="setBank" placeholder="Tên ngân hàng" value="${b.bank || ''}">
      <input id="setStk" placeholder="Số tài khoản" value="${b.stk || ''}">
      <input id="setOwner" placeholder="Chủ tài khoản" value="${b.owner || ''}">
      <input id="setPrefix" placeholder="Tiền tố nội dung CK" value="${b.prefix || ''}">
      <button class="btn" onclick="saveBankInfo()">💾 Lưu cài đặt</button>`;
  }
}

window.adminDepositSelf = async () => {
  const amt = parseInt(document.getElementById('adminDepositAmount').value);
  if (!amt || amt < 2000) return window.notif('Tối thiểu 2.000đ', true);
  const snap = await get(ref(db, 'users/_admin_'));
  const u = snap.val() || {};
  await update(ref(db, 'users/_admin_'), { balance: (u.balance || 0) + amt });
  window.notif('Đã cộng ' + amt.toLocaleString() + 'đ!');
  renderAdminPanel();
};

// HỦY ĐƠN NẠP
window.rejectDepositUI = (depositId) => {
  const reason = prompt('Nhập lý do hủy đơn:\n(VD: CK thiếu, CK sai nội dung...)', 'CK thiếu, vui lòng liên hệ admin ' + ADMIN_PHONE);
  if (reason === null) return;
  rejectDeposit(depositId, reason);
};

window.rejectDeposit = async (depositId, reason) => {
  const snap = await get(ref(db, 'deposits/' + depositId));
  const d = snap.val();
  if (!d) return;
  await update(ref(db, 'deposits/' + depositId), { status: 'rejected', reason: reason || 'Không có lý do', rejectedAt: Date.now() });
  
  // Cập nhật trong lịch sử user
  const uSnap = await get(ref(db, 'users/' + d.uid));
  const u = uSnap.val();
  if (u && u.deposits) {
    const idx = u.deposits.findIndex(x => x.code === d.code && x.time === d.time);
    if (idx >= 0) {
      u.deposits[idx].status = 'rejected';
      u.deposits[idx].reason = reason;
      await update(ref(db, 'users/' + d.uid), { deposits: u.deposits });
    }
  }
  window.notif('Đã hủy đơn!');
  renderAdminPanel();
};

window.approveDeposit = async (depositId, uid, amount) => {
  const snap = await get(ref(db, 'deposits/' + depositId));
  const d = snap.val();
  if (!d) return;
  const uSnap = await get(ref(db, 'users/' + uid));
  const u = uSnap.val();
  if (!u) return window.notif('User không tồn tại', true);
  
  await update(ref(db, 'users/' + uid), {
    balance: (u.balance || 0) + amount,
    totalDeposited: (u.totalDeposited || 0) + amount
  });
  await update(ref(db, 'deposits/' + depositId), { status: 'approved', approvedAt: Date.now() });
  
  // Cập nhật trong lịch sử user
  if (u.deposits) {
    const idx = u.deposits.findIndex(x => x.code === d.code && x.time === d.time);
    if (idx >= 0) {
      u.deposits[idx].status = 'approved';
      await update(ref(db, 'users/' + uid), { deposits: u.deposits });
    }
  }
  window.notif('Đã duyệt +' + amount.toLocaleString() + 'đ');
  renderAdminPanel();
};

// ============ THÊM ACC ============
window.addSingleAccNew = () => {
  const val = document.getElementById('singleAccInput').value.trim();
  if (!val) return window.notif('Nhập acc trước', true);
  tempNewProductAccs.push(val);
  document.getElementById('singleAccInput').value = '';
  renderAccListNew();
  window.notif('Đã thêm acc');
};

function renderAccListNew() {
  const box = document.getElementById('accListBox');
  if (!box) return;
  if (tempNewProductAccs.length === 0) {
    box.innerHTML = '<div class="acc-empty">Chưa có acc nào</div>';
    return;
  }
  box.innerHTML = tempNewProductAccs.map((a, i) => `
    <div class="acc-item"><span>${a}</span><button onclick="removeAccNew(${i})">🗑</button></div>
  `).join('');
}

window.removeAccNew = (i) => { tempNewProductAccs.splice(i, 1); renderAccListNew(); };

window.openAddAcc = async (id, name) => {
  tempAccProductId = id;
  const snap = await get(ref(db, 'products/' + id));
  const p = snap.val();
  tempAccList = [...(p.accounts || [])];
  document.getElementById('addAccModalContent').innerHTML = `
    <h2>➕ Thêm acc vào "${name}"</h2>
    <p style="font-size:13px;color:#9ca3af;margin-bottom:12px">Nhập từng acc vào ô bên dưới</p>
    <div id="accListBox2" class="acc-list"></div>
    <input id="singleAccInput2" placeholder="Nhập acc: user|pass">
    <button class="btn btn-secondary" onclick="addSingleAccExisting()" style="margin-bottom:12px">➕ Thêm vào danh sách</button>
    <button class="btn" onclick="saveAccToProduct()">💾 Lưu tất cả</button>
    <button class="btn btn-secondary" onclick="closeModal('addAccModal')" style="margin-top:8px">Hủy</button>`;
  renderAccList2();
  document.getElementById('addAccModal').classList.add('show');
};

function renderAccList2() {
  const box = document.getElementById('accListBox2');
  if (!box) return;
  if (tempAccList.length === 0) { box.innerHTML = '<div class="acc-empty">Chưa có acc nào</div>'; return; }
  box.innerHTML = tempAccList.map((a, i) => `
    <div class="acc-item"><span>${a}</span><button onclick="removeAcc2(${i})">🗑</button></div>
  `).join('');
}

window.addSingleAccExisting = () => {
  const val = document.getElementById('singleAccInput2').value.trim();
  if (!val) return window.notif('Nhập acc trước', true);
  tempAccList.push(val);
  document.getElementById('singleAccInput2').value = '';
  renderAccList2();
  window.notif('Đã thêm acc');
};

window.removeAcc2 = (i) => { tempAccList.splice(i, 1); renderAccList2(); };

window.saveAccToProduct = async () => {
  await update(ref(db, 'products/' + tempAccProductId), { accounts: tempAccList });
  window.notif('Đã lưu!');
  closeModal('addAccModal');
  renderAdminPanel();
};

window.saveBankInfo = async () => {
  const bank = document.getElementById('setBank').value.trim();
  const stk = document.getElementById('setStk').value.trim();
  const owner = document.getElementById('setOwner').value.trim();
  const prefix = document.getElementById('setPrefix').value.trim();
  await update(ref(db, 'settings/bank'), { bank, stk, owner, prefix });
  bankInfo = { ...bankInfo, bank, stk, owner, prefix };
  window.notif('Đã lưu!');
};

window.addProduct = async () => {
  const name = document.getElementById('pName').value.trim();
  const image = document.getElementById('pImage').value.trim();
  const icon = document.getElementById('pIcon').value.trim();
  const price = parseInt(document.getElementById('pPrice').value);
  const description = document.getElementById('pDesc').value.trim();
  if (!name || !price) return window.notif('Nhập tên và giá', true);
  await push(ref(db, 'products'), { name, image, icon, price, description, accounts: [...tempNewProductAccs], createdAt: Date.now() });
  window.notif('Đã tạo sản phẩm!');
  tempNewProductAccs = [];
  renderAdminPanel();
};

window.deleteProduct = async (id) => {
  if (!confirm('Xóa sản phẩm này?')) return;
  await remove(ref(db, 'products/' + id));
  window.notif('Đã xóa');
  renderAdminPanel();
};

// INIT
loadCurrentUser();
updateAuthUI();
</script>
